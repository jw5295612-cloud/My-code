name: Process approvals

# Runs when you tick leads in a "leads-review" issue and save it.
on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: localscout-data
  cancel-in-progress: false

jobs:
  approve-and-send:
    # Only the repo owner's edits on review issues count as approval.
    if: >-
      contains(github.event.issue.labels.*.name, 'leads-review') &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Approve ticked leads and send
        id: send
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue.md"
          python -m localscout approve-from-issue "$RUNNER_TEMP/issue.md"
          python -m localscout send | tee "$RUNNER_TEMP/summary.txt"

      - name: Commit results
        run: |
          git config user.name "localscout-bot"
          git config user.email "localscout-bot@users.noreply.github.com"
          git add data outbox
          git diff --cached --quiet || git commit -m "Process approvals from #${{ github.event.issue.number }}"
          git pull --rebase
          git push

      - name: Report back on the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --body-file "$RUNNER_TEMP/summary.txt"
